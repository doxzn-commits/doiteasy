<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘런스 초대</title>
<meta name="description" content="둘이 사는 집의 일정·집안일·식단·지출을 한곳에서 같이 봐요.">
<meta property="og:title" content="캘런스 초대">
<meta property="og:description" content="둘이 사는 집의 일정·집안일·식단·지출을 한곳에서 같이 봐요.">
<meta name="robots" content="noindex">
<!-- 코드는 주소에만 있다. 스토어로 넘어갈 때 주소가 따라가지 않게 한다. -->
<meta name="referrer" content="no-referrer">
<style>
  :root {
    --bg: #fcfcfb; --fg: #1c2320; --muted: #5c6661; --line: #dfe3e0;
    --brand: #17191C; --on-brand: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141917; --fg: #eef1ef; --muted: #a5aeaa; --line: #333b37; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 420px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.4; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .code {
    padding: 20px 8px; border: 1px solid var(--line); border-radius: 12px;
    text-align: center; font-size: 34px; font-weight: 700; letter-spacing: .18em;
    user-select: all; -webkit-user-select: all;
  }
  a.button, button {
    display: block; width: 100%; padding: 16px; border: 0; border-radius: 12px;
    background: var(--brand); color: var(--on-brand); text-align: center;
    text-decoration: none; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  a.button.quiet { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>둘이 사는 집의 일정·집안일·식단·지출을 한곳에서 같이 봐요.</h1>
  <p id="guide">캘런스를 설치하고 앱에서 ‘초대 코드가 있어요’를 누른 뒤 코드를 넣어주세요.</p>
  <div class="code" id="code" hidden></div>
  <button type="button" id="go" hidden>코드 복사하고 설치하기</button>
  <p id="note" role="status" hidden></p>
  <div id="stores" style="display:grid;gap:12px" hidden>
    <a class="button quiet" id="ios">App Store에서 받기</a>
  </div>
</main>
<script>
  (function () {
    // ⚠ 스토어 주소는 여기 한 곳이다. 앱 빌드 없이 고칠 수 있는 것이 이 페이지의 이유다.
    var STORE = {
      ios: 'https://apps.apple.com/kr/app/id6806593371'
    };

    // 코드표는 서버 private.gen_invite_code() 와 같다. 코드는 어디에도 저장하지 않는다.
    var match = /\/i\/([2-9A-HJ-NP-Z]{6})\/?$/i.exec(location.pathname);
    var code = match ? match[1].toUpperCase() : null;

    var ua = navigator.userAgent;
    var ipad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    var device = /android/i.test(ua) ? 'android' : (/iphone|ipad|ipod/i.test(ua) || ipad) ? 'ios' : null;

    var el = function (id) { return document.getElementById(id); };
    el('ios').href = STORE.ios;

    if (code) {
      el('code').textContent = code;
      el('code').hidden = false;
    }

    // 안드로이드 앱은 출시 전이다. 코드만 보여 주고 설치로 보내지 않는다.
    // 되돌리는 법은 landing/README.md 에 있다.
    if (device === 'android') {
      el('guide').hidden = true;
      el('note').textContent = '안드로이드 앱은 준비하고 있어요.';
      el('note').hidden = false;
      return;
    }

    // 기기를 모르면 스토어 버튼을 둔다. 코드는 화면에 있으니 눌러서 복사할 수 있다.
    if (!device) { el('stores').hidden = false; return; }

    var go = el('go');
    if (!code) go.textContent = '설치하기';
    go.hidden = false;

    function copy() {
      if (!code) return Promise.resolve(true);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(code).then(function () { return true; }, legacyCopy);
      }
      return Promise.resolve(legacyCopy());
    }

    // ⚠ 카카오톡 안 브라우저처럼 clipboard 가 막힌 곳이 있다.
    function legacyCopy() {
      try {
        var range = document.createRange();
        range.selectNodeContents(el('code'));
        var picked = window.getSelection();
        picked.removeAllRanges();
        picked.addRange(range);
        return document.execCommand('copy');
      } catch (e) {
        return false;
      }
    }

    var noticed = false;
    go.addEventListener('click', function () {
      if (noticed) { location.href = STORE[device]; return; }
      copy().then(function (copied) {
        if (copied) { location.href = STORE[device]; return; }
        // 바로 넘어가면 읽을 틈이 없다. 안내를 보이고 한 번 더 누르게 한다.
        // 메시지에도 코드가 남아 있으므로 복사 실패가 설치를 막지는 않는다.
        el('note').textContent = '복사가 안 됐어요. 받은 메시지의 코드를 앱에 넣어주세요.';
        el('note').hidden = false;
        go.textContent = '설치하러 가기';
        noticed = true;
      });
    });
  })();
</script>
</body>
</html>
